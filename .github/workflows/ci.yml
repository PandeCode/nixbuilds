name: "Build and Push to Cachix"

on:
  push:
    branches:
      - main # only build on push to main
  pull_request: # still build for all PRs

permissions:
  contents: read

jobs:
  build:
    if: >
      !(
        (github.event_name == 'push' &&
         startsWith(github.event.head_commit.message, 'nobuild:')) ||
        (github.event_name == 'pull_request' &&
         startsWith(github.event.pull_request.title, 'nobuild:'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: charon
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build packages and checks
        run: nix flake check --keep-going

      - name: Check devShell
        run: nix develop --command echo OK
